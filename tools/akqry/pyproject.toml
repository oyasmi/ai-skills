[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "akqry"
dynamic = ["version"]
description = "Auditable CLI for discovering and querying AkShare data interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.78,<2",
    # Imported directly by the serializers and metrics modules, so it is declared
    # here rather than relied on as an AkShare transitive dependency.
    "pandas>=2.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
akqry = "akqry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
root = "../.."
version_file = "src/akqry/_version.py"
fallback_version = "0+unknown"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
