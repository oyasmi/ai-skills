[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akqry"
version = "0.1.0"
description = "Auditable CLI for discovering and querying AkShare data interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.78,<2",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
akqry = "akqry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
