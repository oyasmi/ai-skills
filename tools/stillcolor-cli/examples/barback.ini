# Paste into Barback's "Import from supervisor" after replacing the user's home path.
# Add one-shot commands separately as described in README.md.
[program:stillcolor-watch]
command="/Users/YOUR_USER/.local/bin/stillcolor-cli" watch
autostart=false
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=5
redirect_stderr=true
